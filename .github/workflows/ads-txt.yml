name: ads.txt
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run config:validate
      - run: npm run ads:check
